# Touch-trace diagnostic build. Layered on prj.conf via
# -Dfirmware_EXTRA_CONF_FILE=trace.conf; pair with trace.overlay.
CONFIG_BLINK_TOUCH_TRACE=y

# The dump printk()s from the input thread, whose default 1024 B stack is sized
# for callbacks that only forward events.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# The LVGL pool is NOT shrunk here any more. It used to be, to 27648, when
# dram1_0_seg was ~99% full in a release build and the tracer's 1.5 KB ring
# plus the bigger input stack overflowed it by 612 B. That segment measured
# 66% used with the 40 KB pool in 1.7.1 (64776 of 96 KB), and the settings
# panel alone now needs more than 27648 to draw -- see the pool's note in
# prj.conf -- so a trace build at that size would halt the first time
# settings opened. The trace build inherits the release pool.
