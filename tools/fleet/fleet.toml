# The desks a release is proved on, as they were measured -- not as they are
# assumed. Each holds one board and answers for one platform.
#
# This fork has ONE. Upstream (KfirLevy258/Blink) listed three -- its own Mac,
# an Ubuntu laptop and a Windows 10 box -- reached over ssh. None of them is
# reachable from here, and pc/fleet_gate.py insists that EVERY desk in this file
# has passed, so while they stayed listed no release could ever be cut from this
# fork (2026-10-13). Linux and Windows are therefore proved only by the CI
# install check in release-binaries.yml, not by a real board; add a desk here
# when one exists.
#
# There is deliberately NO port in this file. The daemon finds the board by
# USB VID:PID (claude_usage_bridge.py:41-48, CH340 0x1A86:0x7523), which is
# how it picks COM15 out of the Windows desk's twelve mostly-Bluetooth COM
# ports. A port written down here would work until somebody moved the cable
# to the next socket, and would then fail as a dead board.
#
# `python` must be an interpreter WITH PYSERIAL on that machine: the agent
# spawns blink_main.py, which imports serial at module scope. Checking that
# is a one-liner per desk and is worth doing before blaming the hardware:
#
#     <python> -c "import serial; print(serial.__version__)"

[hosts.local-mac]
ssh = ""                    # empty = run here, with no ssh at all
os = "darwin"
# Measured 2026-10-12, not assumed: board 8c94df935ad0 (unfused CYD,
# /dev/cu.usbserial-141230) was stamped CLAUDE by tools/burn.sh, and its boot
# log reported "[boot] edition: claude" after a power cycle. The edition
# latches, so this line can only become wrong if the board itself is swapped.
board = "claude"
# Relative paths are resolved against this checkout, not the workdir. The
# fleet venv is the only interpreter on this Mac that has pyserial (system
# python3 is Apple's 3.9), and it is gitignored, so it is not inside the
# snapshot that gets pushed.
python = ".venv-test/bin/python"
workdir = "~/blink-fleet"
has_claude_desktop = false
